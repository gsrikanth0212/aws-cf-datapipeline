# Reusable workflow: deploys ONE environment. Called 3 times by deploy.yml (dev, stage, prod)
# so the deploy steps are written once.
name: Deploy one environment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    # The GitHub Environment holds the AWS_DEPLOY_ROLE_ARN secret and (for prod) the
    # "required reviewers" rule that pauses the run until someone approves.
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Read region from config
        id: cfg
        run: echo "region=$(yq -r '.aws_region' configs/${{ inputs.environment }}.yaml)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ steps.cfg.outputs.region }}

      - name: Deploy
        run: ./scripts/deploy.sh ${{ inputs.environment }}

      - name: Keep packaged template
        uses: actions/upload-artifact@v4
        with:
          name: packaged-template-${{ inputs.environment }}
          path: build/packaged-${{ inputs.environment }}.yaml
